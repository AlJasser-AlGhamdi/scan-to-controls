[project]
name = "p2c"
version = "0.0.0"
description = "From Ports to Controls — what an external scan can prove about ECC-2:2024 and NCNICC-1:2025, tested on 100 synthetic Saudi SMEs"
readme = "README.txt"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "ports-to-controls" }]
dependencies = [
    "compliance-trestle==4.1.0",  # build-time OSCAL models (mapping/catalog_build.py)
    "cryptography>=45.0.0",       # scanning/tls.py X.509 parsing (self-signed, key strength)
    "dnspython>=2.7.0",           # scanning/dns_sec.py DnspythonResolver (the concrete resolver)
    "httpx>=0.28.1",              # discovery/crtsh.py, scanning/mta_sts.py, run_calibration.py
    "idna>=3.18",                 # hosts.py IDNA canonicalization
    "numpy>=2.5.0",               # config.seed_everything, evaluation/metrics, scoring/weights
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",       # pydantic-settings env_file support
    "scipy>=1.18.0",              # metrics (linear_sum_assignment), weights (linprog)
    "structlog>=26.1.0",
]

[project.optional-dependencies]
eval = [
    "scikit-learn>=1.4",
    "krippendorff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2c"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "PL",            # pylint subset
    "RUF",           # ruff-specific
    "ANN",           # type annotations
    "ASYNC",
]
ignore = [
    "ANN401",  # allow typing.Any where deliberately needed (egress hooks)
    "PLR0913", # many-args (schemas / signers)
    "PLR0917", # same rationale as PLR0913; it went stable in a ruff newer than ~/atlas pinned
]

[tool.ruff.lint.pylint]
max-returns = 8  # egress policy uses clear, flat early returns
max-statements = 65  # egress_guard.install() patches many socket chokepoints inline

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]
"src/p2c/mapping/_arabic.py" = ["E501", "RUF001"]
"src/p2c/_embed.py" = ["RUF001"]
"scripts/extract_regulations.py" = ["RUF001", "PLR2004", "PLC0415"]
"src/p2c/scanning/engine.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["p2c"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
exclude = "src/p2c/scanning/engine.py"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "uvloop",
    "scipy.*",
    "p2c.rag.bge",
    "p2c.llm.provider",
    "extract_regulations",
    "extract_taxonomy",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["p2c.mapping.catalog_build"]
disable_error_code = ["call-arg", "arg-type", "no-any-return"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires docker services (compose up test-target)",
    "e2e: full synthetic-profile -> report pipeline",
    "sovereignty: asserts zero non-allowlisted egress",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/p2c"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "hypothesis>=6.155.7",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]
