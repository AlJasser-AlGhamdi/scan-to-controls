# Deterministic detector test matrix (ethical, offline).
#
# HTTP :80 carries the header, cookie and development-server cases on separate paths, so one
# listener serves both a planted defect and its clean control. HTTPS :443 and :8444 to :8449 each
# serve one certificate property, so a measurement can attribute a finding to a single axis.

server {
    listen 80 default_server;
    server_name test-target.local;

    # The original planted case: no security headers at all.
    location / {
        add_header Content-Type text/plain;
        return 200 "atlas test-target: intentionally missing security headers\n";
    }

    # Clean control: every security header the suite reads, including Permissions-Policy.
    location /clean {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=()" always;
        add_header Content-Type text/plain always;
        return 200 "clean control\n";
    }

    # Every header except Permissions-Policy: isolates that one read from the other five.
    location /no-permissions-policy {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Type text/plain always;
        return 200 "permissions-policy absent\n";
    }

    # A session cookie without the Secure attribute, alongside one that has it.
    location /cookie-insecure {
        add_header Set-Cookie "sid=abc123; Path=/; HttpOnly" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=()" always;
        add_header Content-Type text/plain always;
        return 200 "cookie without Secure\n";
    }

    # Control: every cookie carries Secure.
    location /cookie-secure {
        add_header Set-Cookie "sid=abc123; Path=/; Secure; HttpOnly" always;
        add_header Set-Cookie "pref=dark; Path=/; Secure" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=()" always;
        add_header Content-Type text/plain always;
        return 200 "cookies with Secure\n";
    }

    # A development server announcing itself in the Server header.
    location /dev-server {
        add_header Server "Werkzeug/3.0.1 Python/3.12.1" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=()" always;
        add_header Content-Type text/plain always;
        return 200 "development server signature\n";
    }

    # Control: a production server on a host whose *name* suggests development. The detector must
    # read the signature, not the name, so this must stay silent.
    location /dev-name-only {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=()" always;
        add_header Content-Type text/plain always;
        return 200 "dev.example hostname, production server\n";
    }

}

# --- one certificate property per listener -------------------------------------------------

server {
    listen 443 ssl;
    server_name test-target.local;
    ssl_certificate     /etc/nginx/tls/selfsigned2048.crt;
    ssl_certificate_key /etc/nginx/tls/selfsigned2048.key;
    location / { add_header Content-Type text/plain; return 200 "self-signed rsa2048\n"; }
}

server {
    listen 8444 ssl;
    server_name leaf.test-target.local;
    ssl_certificate     /etc/nginx/tls/leaf.crt;
    ssl_certificate_key /etc/nginx/tls/leaf.key;
    location / { add_header Content-Type text/plain; return 200 "private-CA leaf\n"; }
}

server {
    listen 8445 ssl;
    server_name weak.test-target.local;
    ssl_certificate     /etc/nginx/tls/rsa1024.crt;
    ssl_certificate_key /etc/nginx/tls/rsa1024.key;
    # OpenSSL refuses to serve a 1024-bit certificate at its default security level. A real host
    # with a key this weak is by definition running a stack that permits it, so the level is
    # lowered here to reproduce that host rather than to weaken the scanner.
    ssl_protocols TLSv1.2;
    ssl_ciphers "DEFAULT:@SECLEVEL=0";
    location / { add_header Content-Type text/plain; return 200 "rsa1024\n"; }
}

server {
    listen 8446 ssl;
    server_name strong.test-target.local;
    ssl_certificate     /etc/nginx/tls/rsa4096.crt;
    ssl_certificate_key /etc/nginx/tls/rsa4096.key;
    location / { add_header Content-Type text/plain; return 200 "rsa4096\n"; }
}

server {
    listen 8447 ssl;
    server_name ecp256.test-target.local;
    ssl_certificate     /etc/nginx/tls/ecp256.crt;
    ssl_certificate_key /etc/nginx/tls/ecp256.key;
    location / { add_header Content-Type text/plain; return 200 "ec p-256\n"; }
}

server {
    listen 8448 ssl;
    server_name ecp192.test-target.local;
    ssl_certificate     /etc/nginx/tls/ecp192.crt;
    ssl_certificate_key /etc/nginx/tls/ecp192.key;
    # Same reason: secp192r1 is below the default security level.
    ssl_protocols TLSv1.2;
    ssl_ciphers "DEFAULT:@SECLEVEL=0";
    ssl_ecdh_curve secp192r1;
    location / { add_header Content-Type text/plain; return 200 "ec secp192r1\n"; }
}

server {
    listen 8449 ssl;
    server_name expired.test-target.local;
    ssl_certificate     /etc/nginx/tls/expired.crt;
    ssl_certificate_key /etc/nginx/tls/expired.key;
    location / { add_header Content-Type text/plain; return 200 "expired\n"; }
}
