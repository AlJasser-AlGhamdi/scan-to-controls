services:
  test-matrix:
    build: ./test-target
    image: p2c-test-matrix:latest
    container_name: p2c-matrix
    ports:
      - "127.0.0.1:9080:80"
      - "127.0.0.1:9443:443"
      - "127.0.0.1:9444:8444"
      - "127.0.0.1:9445:8445"
      - "127.0.0.1:9446:8446"
      - "127.0.0.1:9447:8447"
      - "127.0.0.1:9448:8448"
      - "127.0.0.1:9449:8449"
    restart: unless-stopped
  test-dns:
    image: coredns/coredns:1.11.3@sha256:9caabbf6238b189a65d0d6e6ac138de60d6a1c419e5a341fbbb7c78382559c6e
    container_name: p2c-matrix-dns
    command: ["-conf", "/zones/Corefile"]
    volumes:
      - ./test-target/dns:/zones:ro
    ports:
      - "127.0.0.1:9053:53/udp"
      - "127.0.0.1:9053:53/tcp"
    restart: unless-stopped
  test-banner:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    container_name: p2c-matrix-banner
    command: ["python", "/srv/server.py"]
    volumes:
      - ./test-target/banner:/srv:ro
    ports:
      - "127.0.0.1:9081:8080"
    restart: unless-stopped
